databases:
  - name: cosmic-db
    plan: free
    databaseName: cosmic_db
    user: cosmic_user

services:
  - type: web
    name: cosmic-split-system
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-db
          property: connectionString
      - key: SENSENOVA_API_KEY
        sync: false
      - key: SENSENOVA_BASE_URL
        value: https://token.sensenova.cn/v1
      - key: SENSENOVA_MODEL
        value: deepseek-v4-flash
      - key: SENSENOVA_GLM_MODEL
        value: glm-5.2
      - key: SENSENOVA_FLASH_LITE_MODEL
        value: sensenova-6.8-flash-lite
      - key: VOLCENGINE_API_KEY
        sync: false
      - key: VOLCENGINE_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/coding
      - key: VOLCENGINE_MODEL
        value: deepseek-v4-pro-260425
      - key: VISION_API_KEY
        sync: false
      - key: VISION_BASE_URL
        sync: false
      - key: VISION_MODEL
        value: gpt-4o-mini
      - key: DEFAULT_MODEL
        value: deepseek-v4-flash-free
      - key: JWT_SECRET
        generateValue: true
