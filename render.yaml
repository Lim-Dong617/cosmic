databases:
  - name: cosmic-db
    plan: free
    databaseName: cosmic_db
    user: cosmic_user

services:
  - type: web
    name: cosmic-split-system
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-db
          property: connectionString
      - key: SENSENOVA_API_KEY
        sync: false
      - key: SENSENOVA_BASE_URL
        value: https://token.sensenova.cn/v1
      - key: SENSENOVA_MODEL
        value: deepseek-v4-flash
      - key: DEFAULT_MODEL
        value: deepseek-v4-flash-free
      - key: JWT_SECRET
        generateValue: true
