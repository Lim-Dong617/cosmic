databases:
  - name: cosmic-db
    plan: free
    databaseName: cosmic_db
    user: cosmic_user

services:
  - type: web
    name: cosmic-split-system
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-db
          property: connectionString
      # 火山引擎模型
      - key: VOLCENGINE_API_KEY
        sync: false
      - key: VOLCENGINE_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: VOLCENGINE_CODING_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/coding
      # 四个模型 ID
      - key: VOLCENGINE_V4_PRO_GA_MODEL
        value: deepseek-v4-pro-ga-260813
      - key: VOLCENGINE_V4_FLASH_GA_MODEL
        value: deepseek-v4-flash-ga-260731
      - key: VOLCENGINE_V4_PRO_MODEL
        value: deepseek-v4-pro-260425
      - key: VOLCENGINE_V4_FLASH_MODEL
        value: deepseek-v4-flash-260425
      # NVIDIA NIM DeepSeek V4 Pro（OpenAI 兼容接口）
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_V4_PRO_MODEL
        value: deepseek-ai/deepseek-v4-pro-0813
      # 第五路：UnlimitDS DeepSeek V4 Pro（与 NVIDIA 独立）
      - key: UNLIMITDS_API_KEY
        sync: false
      - key: UNLIMITDS_BASE_URL
        value: https://unlimitds.chat/v1
      - key: UNLIMITDS_V4_PRO_MODEL
        value: deepseek-v4-pro
      # 默认模型
      - key: DEFAULT_MODEL
        value: deepseek-v4-pro-ga
      # AI 稳定性：关闭 SDK 隐式重试，由服务端统一限流和重试
      - key: AI_MAX_CONCURRENCY
        value: 2
      - key: AI_MAX_ATTEMPTS
        value: 4
      - key: AI_REQUEST_TIMEOUT_MS
        value: 480000
      # Pro 模型使用流式响应；连续2分钟无任何分片即判定卡流并释放并发槽
      - key: AI_STREAM_IDLE_TIMEOUT_MS
        value: 120000
      - key: AI_QUEUE_TIMEOUT_MS
        value: 600000
      # 模块脚手架阶段快速失败并走标题兜底，避免界面长时间停在 40%
      - key: AI_MODULE_REQUEST_TIMEOUT_MS
        value: 120000
      - key: AI_MODULE_MAX_ATTEMPTS
        value: 2
      - key: JWT_SECRET
        generateValue: true
